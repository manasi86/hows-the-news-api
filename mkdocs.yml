# Set strict to true to turn warnings into errors to catch warnings within CI.
strict: true
# Use non-directory URLs so that mkdocstrings/autorefs cross-references between
# modules are computed correctly for the nested api/routes package.
use_directory_urls: false
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  # By default, fonts are pulled from Google on the Internet. To support offline usage, this is
  # disabled.
  font: false
  palette:
    scheme: slate
    primary: green
    accent: yellow
  icon:
    logo: material/math-integral-box
    # GitHub specific.
    repo: fontawesome/brands/github
  favicon: static/math-integral-box.png
  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.indexes
    - navigation.expand
    - navigation.footer
    - navigation.path
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
markdown_extensions:
  - abbr
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - md_in_html
extra_css:
  - static/stylesheets/extra.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nalits/hows-the-news
plugins:
  - search
  - offline:
      enabled: !ENV [MKDOCS_MATERIAL_OFFLINE, false]
  - mkdocstrings:
      handlers:
        python:
          options:
            show_if_no_docstring: true
            show_signature_annotations: true
  # Autodoc configuration.
  # https://github.com/tlambert03/mkdocs-api-autonav#configuration
  - api-autonav:
      modules: ["src/lib", "src/api"]
  # This plugin is used to validate URLs (including anchors).
  - htmlproofer:
      # This is not enabled by default because this requires network I/O, so it is inherently not
      # exactly reproducible. For larger projects, this can also slow local build times.
      validate_external_urls: !ENV [HTMLPROOFER_VALIDATE_EXTERNAL_URLS, false]
      # mkdocstrings generates cross-module references as anchors (e.g.
      # `schemas.html#api.schemas.TextRequest`). The htmlproofer plugin validates these by
      # matching heading text and only sees pages as they are built, so it cannot verify
      # mkdocstrings cross-references. Skip those URLs rather than treating them as errors.
      ignore_urls:
        - "*schemas.html#*"
      raise_error: False
watch:
  # Watch src/ directory to reload on changes to docstrings for mkdocstrings plugin.
  - src
site_name: hows-the-news
copyright: Copyright &copy; 2018-2026
# GitHub Specific Configuration.
repo_name: hows-the-news
repo_url: https://github.com/nalits/hows-the-news
edit_uri: edit/main/docs/user_guide/docs/
nav:
  - index.md
  - Third Party Licenses:
    - licenses/license_report.md
